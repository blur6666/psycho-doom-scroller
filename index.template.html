<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychedelic GLSL Shader with ✨ AI Themes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            height: 100;
            margin: 0;  
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            display: block;
            width: 100vw;
            height: 100vh;
        }
        /* Simple spinner animation */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script id="vertex-shader" type="x-shader/x-vertex">{{VERTEX_SHADER}}</script>
    <script id="fragment-shader" type="x-shader/x-fragment">{{FRAGMENT_SHADER}}</script>
</head>
<body>
    <canvas id="glsl-canvas" width="500" height="500"></canvas>
    <script type="text/javascript" src="./static/webgl.js"></script>
</body>
</html>
