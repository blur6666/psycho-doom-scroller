<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PsychoDoom Shader Scroller</title>
    <link rel="stylesheet" href="./style.css">
    <!-- Default vertex shader -->
    <script id="vertex-shader" type="x-shader/x-vertex">#version 300 es
precision highp float;

in vec4 aVertexPosition;

void main() {
    gl_Position = vec4(aVertexPosition.xy, 0.0, 1.0);
}
</script>
    <!-- Default fragment shader with enhanced uniform support -->
    <script id="fragment-shader" type="x-shader/x-fragment">#version 300 es
precision highp float;

// Standard uniforms
uniform vec2 u_resolution;  // Canvas resolution (width, height)
uniform float u_time;       // Time in seconds
uniform float u_aspectRatio; // Aspect ratio (width / height)
uniform int u_isLandscape;  // 1 if landscape, 0 if portrait

out vec4 outColor;

vec3 palette(float t) {
    vec3 a = vec3(0.5, 0.5, 0.5);
    vec3 b = vec3(0.5, 0.5, 0.5);
    vec3 c = vec3(1.0, 1.0, 1.0);
    vec3 d = vec3(0.263, 0.416, 0.557);

    return a+b*cos(6.28*(c*t*d));
}

void main() {
    // Better aspect ratio handling
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
    uv = uv * 2.0 - 1.0;
    
    // Use the aspect ratio uniform for consistent sizing
    uv.x *= u_aspectRatio;
    
    vec2 uv0 = uv;
    vec3 finalColor = vec3(0.0);

    for (float i = 0.0; i<4.0; i++) {
        uv = fract(uv*1.5)-0.5;

        float d = length(uv)*exp(-length(uv0));
        d = sin(d*8.f+u_time)/8.;
        d = abs(d);
        d = pow(0.01/d, 1.2);

        vec3 color = palette(length(uv0)+i*.4+u_time*0.4);

        finalColor += color*d;
    }

    outColor = vec4(finalColor, 1.0);
}</script>
</head>
<body>
    <!-- Canvas is now created dynamically in webgl.js -->
    <script src="./webgl-utils.js"></script>
    <script src="./webgl.js?v=2"></script>
</body>
</html>
